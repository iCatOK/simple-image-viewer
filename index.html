<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Image Viewer</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <!-- 
    Deployment Instructions:
    This is a static web application. To deploy, simply upload the contents 
    of this project (index.html, index.css, index.js, metadata.json) to any static 
    hosting provider like GitHub Pages, Netlify, Vercel, or an S3 bucket.

    Usage:
    Append the URL of an image to the site's address.
    Example: https://your-site.com/https://i.imgur.com/your-image.jpeg
  -->
  <div id="app-container">
    <div id="loader" class="hidden"></div>
    <div id="error-container" class="hidden">
      <p id="error-message"></p>
      <p class="usage-info">
        <strong>Usage:</strong> Append a direct image URL to this page's path.
        <br>
        Example: <code>.../https://i.imgur.com/r3u917w.jpeg</code>
      </p>
    </div>
    <div id="image-viewer" class="hidden">
      <div id="image-container">
        <img id="main-image" alt="Image to be viewed" draggable="false">
      </div>
    </div>
    <div id="ui-controls" class="hidden">
      <span id="zoom-display">100%</span>
      <button id="reset-btn" title="Reset View">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/></svg>
      </button>
      <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg class="enter-fullscreen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg class="exit-fullscreen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
      </button>
    </div>
  </div>

  <script src="index.js" type="module"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
